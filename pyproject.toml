[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rooftop-solar-analytics"
version = "0.1.0"
description = "Weather-normalised performance analytics for residential rooftop PV, from utility bills and free satellite data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Piyush" }]
keywords = ["solar", "photovoltaic", "energy", "analytics", "performance-ratio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]
pv = ["pvlib>=0.10"]
app = ["streamlit>=1.30"]

[project.scripts]
solar-report = "solar_analytics.cli:main"

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/rooftop-solar-analytics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Long lines are unavoidable in the embedded HTML/CSS report templates,
# and exploratory scripts import after computing paths.
"scripts/*" = ["E501", "E402"]
